name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYAI_COMMIT_SHA: ${{ github.sha }}

jobs:
  quality:
    name: format · lint · typecheck · contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Verify vendored contract against pinned upstream SHA
        run: npm run contracts:verify -- --upstream
      - name: Generated contract types are up to date
        run: |
          if [ -f scripts/generate-contract-types.mjs ]; then
            npm run contracts:types
            git diff --exit-code -- src/contracts/generated
          fi

  unit:
    name: unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build (fixture mode)
        run: npm run build
        env:
          VITE_DATA_MODE: fixture
      - name: Check build contract (version.json, index.html, hashed assets)
        run: node scripts/check-dist.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: browser smoke & accessibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual-performance:
    name: visual regression & Lighthouse budgets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Install deterministic screenshot fonts
        run: sudo apt-get install -y fonts-dejavu-core
      - run: npm run test:visual
      - name: Lighthouse mobile budgets (three runs per route)
        run: npm run test:lighthouse
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-performance-reports
          path: |
            playwright-report-visual/
            test-results-visual/
            lighthouse-report/
          include-hidden-files: true
          retention-days: 14

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run audit

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  ci-required:
    name: ci-required
    if: always()
    needs: [quality, unit, build, e2e, visual-performance, audit, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const ok = (job, n) => n.result === "success" || (job === "dependency-review" && n.result === "skipped");
            const bad = Object.entries(needs).filter(([job, n]) => !ok(job, n));
            if (bad.length) {
              console.error("Failed or cancelled: " + bad.map(([j, n]) => j + "=" + n.result).join(", "));
              process.exit(1);
            }
          '
